<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#70c5ce">
    <title>Kathikalle Umma - Flappy Bird</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2.49.1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #141c24; }
        body { display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-wrapper { position: relative; width: min(100vw, 480px, calc(100vh * 2 / 3)); width: min(100vw, 480px, calc(100dvh * 2 / 3)); aspect-ratio: 2 / 3; overflow: hidden; background: linear-gradient(180deg, #70c5ce 0%, #4a9aaa 100%); box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
        canvas { display: block; width: 100%; height: 100%; border: none; }
        #hud-left { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; display: flex; gap: 6px; z-index: 11; }
        .hud-btn { min-height: 40px; padding: 0 11px; border: 1px solid rgba(255,255,255,0.65); border-radius: 8px; background: rgba(10,30,45,0.78); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.45); display: inline-flex; align-items: center; justify-content: center; gap: 4px; backdrop-filter: blur(4px); transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease; }
        .hud-btn:active { transform: scale(0.95); }
        .hud-btn:hover, .hud-btn:focus-visible { background: rgba(10,30,45,0.96); outline: 2px solid #ffd700; outline-offset: 2px; }
        #mode-toggle.chaos { background: linear-gradient(135deg, rgba(168, 42, 214, 0.9), rgba(236, 72, 153, 0.9)); border-color: #fde047; box-shadow: 0 0 12px rgba(236, 72, 153, 0.55); }
        #mute-toggle { min-width: 40px; padding: 0 8px; font-size: 15px; }
        #lb-open { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 11; min-height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.65); border-radius: 8px; background: rgba(10,30,45,0.78); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.45); backdrop-filter: blur(4px); }
        #lb-open:hover, #lb-open:focus-visible { background: rgba(10,30,45,0.96); outline: 2px solid #ffd700; outline-offset: 2px; }
        #share-btn { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 15; min-height: 42px; padding: 0 18px; border-radius: 999px; border: 2px solid #fff; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35); display: none; }
        #share-btn.visible { display: inline-flex; align-items: center; gap: 6px; animation: fadeIn 0.2s ease; }
        #share-btn:active { transform: translateX(-50%) scale(0.96); }
        #controls-hint { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: white; font-size: 13px; font-weight: 600; text-align: center; opacity: 0.92; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.65); z-index: 10; white-space: nowrap; }

        /* Leaderboard overlay */
        #lb-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 30, 45, 0.92); z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; overflow-y: auto; display: none; }
        #lb-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #lb-overlay h2 { color: #fff; font-size: 22px; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
        #lb-overlay .subtitle { color: rgba(255,255,255,0.85); font-size: 13px; margin-bottom: 12px; }
        #lb-tabs { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; max-width: 360px; }
        .lb-tab { flex: 1; min-height: 38px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
        .lb-tab.active[data-mode="classic"] { background: #ffd700; border-color: #ffd700; color: #1e293b; }
        .lb-tab.active[data-mode="chaos"] { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: #fde047; color: #fff; }
        #lb-name-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; width: 100%; max-width: 360px; }
        #lb-name-row input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: #fff; font-size: 15px; outline: none; }
        #lb-name-row input:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.18); }
        #lb-name-row button { padding: 10px 14px; border-radius: 8px; border: none; background: #ffd700; color: #333; font-weight: 700; font-size: 14px; cursor: pointer; }
        #lb-name-row button:disabled { opacity: 0.5; cursor: default; }
        #lb-status { font-size: 13px; min-height: 20px; margin-bottom: 12px; color: #ffd700; }
        #lb-table { width: 100%; max-width: 360px; border-collapse: collapse; font-size: 14px; }
        #lb-table th { color: rgba(255,255,255,0.6); text-align: left; padding: 6px 8px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.15); }
        #lb-table td { padding: 8px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.08); }
        #lb-table td.rank { width: 32px; font-weight: 700; color: #ffd700; }
        #lb-table td.score { text-align: right; font-weight: 700; color: #fff; }
        #lb-table td.name { word-break: break-word; }
        #lb-empty { text-align: center; color: rgba(255,255,255,0.6); padding: 20px; }
        #lb-close, #lb-refresh { margin-top: 14px; padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; cursor: pointer; }
        #lb-refresh { margin-right: 8px; background: rgba(255,255,255,0.2); }
        #lb-close:hover, #lb-refresh:hover { background: rgba(255,255,255,0.25); }

        /* Game-over status area (outside canvas) */
        #game-status { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 15; pointer-events: none; text-align: center; width: 90%; max-width: 320px; opacity: 0; transition: opacity 0.2s ease; }
        #game-status.active { opacity: 1; }
        #game-status .status-text { color: #fff; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        #game-status .status-sub { color: rgba(255,255,255,0.85); font-size: 12px; margin-top: 2px; }

        /* Mobile safe area */
        @media (max-width: 400px) {
            #lb-overlay h2 { font-size: 20px; }
            #lb-table { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="mycanvas" width="320" height="480"></canvas>
        <div id="hud-left">
            <button id="mode-toggle" class="hud-btn" type="button" aria-label="Switch game mode">Classic</button>
            <button id="mute-toggle" class="hud-btn" type="button" aria-label="Toggle sound">🔊</button>
        </div>
        <button id="lb-open" type="button" aria-haspopup="dialog" aria-controls="lb-overlay">Leaderboard</button>
        <button id="share-btn" type="button" aria-label="Share your score">Share Score</button>
        <div id="controls-hint">Tap anywhere to flap</div>

        <div id="game-status" aria-live="polite">
            <div class="status-text"></div>
            <div class="status-sub"></div>
        </div>

        <div id="lb-overlay" role="dialog" aria-label="Leaderboard" aria-modal="true">
            <h2>Leaderboard</h2>
            <p class="subtitle" id="lb-subtitle">Top 10 Classic scores</p>
            <div id="lb-tabs" role="tablist" aria-label="Leaderboard mode">
                <button id="lb-tab-classic" class="lb-tab active" data-mode="classic" type="button" role="tab" aria-selected="true">Classic</button>
                <button id="lb-tab-chaos" class="lb-tab" data-mode="chaos" type="button" role="tab" aria-selected="false">Chaos+</button>
            </div>
            <div id="lb-name-row">
                <input type="text" id="lb-name-input" placeholder="Your name (max 20 chars)" aria-label="Display name" maxlength="20" autocomplete="off" />
                <button id="lb-save-name" aria-label="Save name">Save</button>
            </div>
            <p id="lb-identity" aria-live="polite" style="margin: -6px 0 10px; color: rgba(255,255,255,0.65); font-size: 11px;">Restoring your anonymous player...</p>
            <div id="lb-status" aria-live="polite"></div>
            <table id="lb-table" aria-label="Top scores">
                <thead>
                    <tr><th>Rank</th><th>Player</th><th>Score</th></tr>
                </thead>
                <tbody id="lb-table-body"></tbody>
            </table>
            <div id="lb-empty">No scores yet. Be the first!</div>
            <div>
                <button id="lb-refresh" aria-label="Refresh leaderboard">Refresh</button>
                <button id="lb-close" aria-label="Close leaderboard">Back to Game</button>
            </div>
            <p style="margin-top:16px; font-size:11px; color:rgba(255,255,255,0.55); text-align:center;">Only an anonymous player ID, display name, score, and submission time are stored.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="leaderboard.js"></script>
    <script src="flappy.js"></script>

    <script>
        // UI wiring
        const lbOverlay = document.getElementById('lb-overlay');
        const lbSubtitle = document.getElementById('lb-subtitle');
        const lbTabClassic = document.getElementById('lb-tab-classic');
        const lbTabChaos = document.getElementById('lb-tab-chaos');
        const lbNameInput = document.getElementById('lb-name-input');
        const lbSaveBtn = document.getElementById('lb-save-name');
        const lbIdentity = document.getElementById('lb-identity');
        const lbStatus = document.getElementById('lb-status');
        const lbBody = document.getElementById('lb-table-body');
        const lbEmpty = document.getElementById('lb-empty');
        const gameStatus = document.getElementById('game-status');
        const gameStatusText = gameStatus.querySelector('.status-text');
        const gameStatusSub = gameStatus.querySelector('.status-sub');

        function updateLeaderboardUI(rows, status, error) {
            const data = rows || (window.Leaderboard ? window.Leaderboard.getTopTen() : []);
            lbBody.innerHTML = '';
            if (data && data.length > 0) {
                lbEmpty.style.display = 'none';
                data.forEach((row, i) => {
                    const tr = document.createElement('tr');
                    const rank = document.createElement('td');
                    rank.className = 'rank';
                    rank.textContent = String(i + 1);
                    const name = document.createElement('td');
                    name.className = 'name';
                    name.textContent = row.display_name || 'Anonymous';
                    const value = document.createElement('td');
                    value.className = 'score';
                    value.textContent = String(row.score);
                    tr.append(rank, name, value);
                    lbBody.appendChild(tr);
                });
            }
            lbEmpty.style.display = data && data.length > 0 ? 'none' : 'block';
            if (status === 'loading') {
                lbStatus.textContent = 'Loading scores...';
                lbEmpty.textContent = '';
            } else if (status === 'error' || status === 'offline') {
                lbStatus.textContent = error || 'Unable to load leaderboard.';
                lbEmpty.textContent = 'Leaderboard unavailable.';
            } else if (status === 'success') {
                lbStatus.textContent = '';
                lbEmpty.textContent = 'No scores yet. Be the first!';
            }
        }

        function setStatusText(msg, sub) {
            if (msg) gameStatusText.textContent = msg;
            if (sub) gameStatusSub.textContent = sub;
            gameStatus.classList.add('active');
            setTimeout(() => gameStatus.classList.remove('active'), 3500);
        }

        function syncLeaderboardTabs(mode) {
            const active = mode === 'chaos' ? 'chaos' : 'classic';
            if (lbTabClassic) {
                lbTabClassic.classList.toggle('active', active === 'classic');
                lbTabClassic.setAttribute('aria-selected', String(active === 'classic'));
            }
            if (lbTabChaos) {
                lbTabChaos.classList.toggle('active', active === 'chaos');
                lbTabChaos.setAttribute('aria-selected', String(active === 'chaos'));
            }
            if (lbSubtitle) {
                lbSubtitle.textContent = active === 'chaos' ? 'Top 10 Chaos+ scores' : 'Top 10 Classic scores';
            }
        }

        function showLeaderboard() {
            const mode = window.getGameMode ? window.getGameMode() : 'classic';
            syncLeaderboardTabs(mode);
            lbOverlay.classList.add('active');
            if (window.Leaderboard) {
                window.Leaderboard.setVisible(true);
                window.Leaderboard.setMode(mode);
            }
            updateLeaderboardUI();
        }

        if (lbTabClassic) {
            lbTabClassic.addEventListener('click', () => {
                syncLeaderboardTabs('classic');
                if (window.Leaderboard) window.Leaderboard.setMode('classic');
            });
        }
        if (lbTabChaos) {
            lbTabChaos.addEventListener('click', () => {
                syncLeaderboardTabs('chaos');
                if (window.Leaderboard) window.Leaderboard.setMode('chaos');
            });
        }

        function hideLeaderboard() {
            lbOverlay.classList.remove('active');
            if (window.Leaderboard) window.Leaderboard.setVisible(false);
        }

        window.addEventListener('leaderboard:change', (event) => {
            const detail = event.detail || {};
            if (detail.status === 'identity') {
                lbIdentity.textContent = 'Anonymous player saved on this browser.';
                return;
            }
            updateLeaderboardUI(detail.rows, detail.status, detail.error);
        });

        lbNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lbSaveBtn.click();
        });

        lbSaveBtn.addEventListener('click', () => {
            if (!window.Leaderboard) return;
            const ok = window.Leaderboard.setDisplayName(lbNameInput.value);
            if (ok) {
                lbStatus.textContent = 'Name saved!';
                lbStatus.style.color = '#ffd700';
                lbNameInput.value = window.Leaderboard.getDisplayName();
                setTimeout(() => { lbStatus.textContent = ''; }, 2000);
            } else {
                lbStatus.textContent = 'Invalid name (max 20 chars, no markup)';
                lbStatus.style.color = '#ff6b6b';
                setTimeout(() => { lbStatus.textContent = ''; }, 2500);
            }
        });

        document.getElementById('lb-refresh').addEventListener('click', () => {
            if (window.Leaderboard) {
                lbStatus.textContent = 'Refreshing...';
                lbStatus.style.color = '#ffd700';
                window.Leaderboard.refresh();
            }
        });

        document.getElementById('lb-close').addEventListener('click', hideLeaderboard);
        document.getElementById('lb-open').addEventListener('click', showLeaderboard);

        // Open leaderboard on a dedicated key (L) or double-tap for accessibility
        document.addEventListener('keydown', (e) => {
            const typing = e.target && e.target.matches('input, textarea, select, [contenteditable="true"]');
            if (e.key === 'l' || e.key === 'L') {
                if (!typing && !lbOverlay.classList.contains('active')) showLeaderboard();
            }
            if (e.key === 'Escape') hideLeaderboard();
        });

        // Initialize leaderboard when available
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Leaderboard) {
                const savedName = window.Leaderboard.getDisplayName();
                if (savedName) {
                    lbNameInput.value = savedName;
                } else {
                    lbNameInput.placeholder = 'Enter your name';
                }
                if (window.Leaderboard.getPlayerId()) {
                    lbIdentity.textContent = 'Anonymous player saved on this browser.';
                }
            } else {
                lbStatus.textContent = 'Leaderboard not configured';
            }
        });
    </script>
</body>
</html>
